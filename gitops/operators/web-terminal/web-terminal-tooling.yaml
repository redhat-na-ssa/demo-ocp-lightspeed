---
apiVersion: workspace.devfile.io/v1alpha2
kind: DevWorkspaceTemplate
metadata:
  annotations:
    controller.devfile.io/allow-import-from: '*'
    web-terminal.redhat.com/unmanaged-state: "true"
  labels:
    console.openshift.io/terminal: "true"
  name: web-terminal-tooling
  namespace: openshift-operators
spec:
  components:
  - container:
      args:
      - /bin/bash
      - -c
      - |
        #!/bin/bash

        [ -d "$HOME/bin" ] || mkdir "$HOME/bin"

        # install nvm at startup - for nodejs
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.4/install.sh | bash
        . "$HOME/.nvm/nvm.sh"

        # install nodejs
        nvm install --lts

        # make node available in the shell
        echo "
        nvm use --lts
        " >> /home/user/.bashrc

        echo "
        GIT_REPO=https://github.com/redhat-na-ssa/demo-ocp-lightspeed.git
        GIT_PATH=demo

        [ -e ~/\${GIT_PATH} ] || git clone \${GIT_REPO} ~/\${GIT_PATH}
        [ -e ~/\${GIT_PATH} ] && cd ~/\${GIT_PATH}

        PATH=\${HOME}/bin:\${HOME}/.local/bin:\${PATH}

        " >> /home/user/.bashrc

        . /home/user/.bashrc

        sleep infinity  # just in case
      cpuLimit: 400m
      cpuRequest: 100m
      image: ghcr.io/redhat-na-ssa/web-terminal-tooling:latest
      memoryLimit: 512Mi
      memoryRequest: 128Mi
      mountSources: false
      sourceMapping: /projects
    name: web-terminal-tooling
