apiVersion: datasciencecluster.opendatahub.io/v1
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    kserve:
      managementState: Managed
      # RawDeployment = plain Kubernetes Deployments/Services for model serving;
      # no Knative Serverless or Service Mesh required.
      # rawDeploymentServiceConfig = Headed if you want normal k8s port management
      # see https://docs.redhat.com/en/documentation/red_hat_openshift_ai_self-managed/2.25/html/installing_and_uninstalling_openshift_ai_self-managed/installing-the-single-model-serving-platform_component-install#configuring-automated-installation-of-kserve_component-install
      defaultDeploymentMode: RawDeployment
      rawDeploymentServiceConfig: Headed
      serving:
        managementState: Removed
        name: knative-serving
    dashboard:
      managementState: Removed
    # Everything else is Removed to keep the install lean and fast for the demo.
    modelmeshserving:
      managementState: Removed
    workbenches:
      managementState: Removed
    datasciencepipelines:
      managementState: Removed
    kueue:
      managementState: Removed
    codeflare:
      managementState: Removed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Removed
    modelregistry:
      managementState: Removed
