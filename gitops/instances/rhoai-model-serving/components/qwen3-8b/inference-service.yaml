apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-8b
  namespace: lightspeed-llm
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: qwen3-8b
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    deploymentStrategy:
      type: Recreate
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      runtime: vllm-runtime
      storageUri: oci://quay.io/redhat-ai-services/modelcar-catalog:qwen3-8b
      args:
        - "--served-model-name=qwen3-8b"
        - "--max-model-len=24576"
        - "--gpu-memory-utilization=0.90"
        - "--max-num-seqs=16"
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "6"
          memory: 24Gi
          nvidia.com/gpu: "1"
